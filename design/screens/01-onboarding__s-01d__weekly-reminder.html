<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>S-01d Weekly reminder — Sunday Sort</title>
<link rel="stylesheet" href="../fonts/inter.css">
<link rel="stylesheet" href="../sunday.css">
<style>body{margin:0;background:#ECE8E0;}</style>
</head>
<body>
<div class="board" style="display:inline-flex;padding:40px;background:#ECE8E0;width:auto;height:auto"><div class="cell"><div class="cap"><span class="id">S-01d</span>Weekly reminder <span class="md">· Sun 18:00 default</span></div>
<div class="ph">
<div class="top"><button aria-label="Back" class="ib"><svg aria-hidden="true" class="i" viewbox="0 0 24 24"><path d="M15 6l-6 6 6 6"></path></svg></button><div class="flex" style="gap:6px"><span style="width:24px;height:8px;border-radius:4px;background:var(--br)"></span><span style="width:24px;height:8px;border-radius:4px;background:var(--br)"></span><span style="width:24px;height:8px;border-radius:4px;background:var(--br)"></span></div><span style="width:48px"></span></div>
<div class="scr" style="gap:18px">
<h1 class="h1" style="margin-top:8px">When do you want to sort your week?</h1>
<div class="fld"><span class="fl">Day</span>
<div class="flex" style="gap:5px">
<button class="chip" style="width:44px;padding:0;justify-content:center;font-size:14px">Mon</button><button class="chip" style="width:44px;padding:0;justify-content:center;font-size:14px">Tue</button><button class="chip" style="width:44px;padding:0;justify-content:center;font-size:14px">Wed</button><button class="chip" style="width:44px;padding:0;justify-content:center;font-size:14px">Thu</button><button class="chip" style="width:44px;padding:0;justify-content:center;font-size:14px">Fri</button><button class="chip" style="width:44px;padding:0;justify-content:center;font-size:14px">Sat</button><button class="chip on" style="width:44px;padding:0;justify-content:center;font-size:14px">Sun</button>
</div>
</div>
<div class="fld"><span class="fl">Time</span><button class="inp" style="justify-content:space-between"><span class="flex"><svg aria-hidden="true" class="i m2" viewbox="0 0 24 24"><path d="M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18zM12 7v5l3 2"></path></svg><span class="xb" style="font-size:22px">18:00</span></span><svg aria-hidden="true" class="i m3" viewbox="0 0 24 24"><path d="M6 9l6 6 6-6"></path></svg></button></div>
<div class="lbl" style="margin-top:6px">Preview</div>
<div class="card" style="display:flex;gap:12px;padding:14px;border-radius:20px">
<svg aria-hidden="true" height="36" style="flex:none" viewbox="0 0 120 120" width="36"><rect fill="#1F2A44" height="120" rx="28" width="120"></rect><circle cx="84" cy="38" fill="#F5B841" r="17"></circle><path d="M30 24h44v70l-7.3-5.5-7.4 5.5-7.3-5.5-7.4 5.5-7.3-5.5-7.3 5.5z" fill="#FAF8F4"></path></svg>
<div class="grow"><div class="flex sb"><span class="ts b">14 entries to sort</span><span class="tx m3">Sun 18:00</span></div><div class="ts m2">About 3 minutes. Tap to sort your week.</div></div>
</div>
<div class="ts m3">Only sent when something is waiting. Never after each entry.</div>
</div>
<div class="col" style="padding:0 20px 36px;gap:4px"><button class="btn w"><svg aria-hidden="true" class="i" viewbox="0 0 24 24"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9M10.3 21a1.9 1.9 0 0 0 3.4 0"></path></svg>Turn on reminder</button><button class="btn txt w">Not now</button></div>
</div>
</div></div>
</body>
</html>
