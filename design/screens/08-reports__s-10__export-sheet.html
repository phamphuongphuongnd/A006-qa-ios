<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>S-10 Export sheet — Sunday Sort</title>
<link rel="stylesheet" href="../fonts/inter.css">
<link rel="stylesheet" href="../sunday.css">
<style>body{margin:0;background:#ECE8E0;}</style>
</head>
<body>
<div class="board" style="display:inline-flex;padding:40px;background:#ECE8E0;width:auto;height:auto"><div class="cell"><div class="cap"><span class="id">S-10</span>Export sheet</div>
<div class="ph">
<div class="top"><span class="h1">Reports</span></div>
<div class="scrim"></div>
<div class="sheet" style="top:64px;gap:12px">
<div class="grab"></div>
<div class="flex sb"><span class="h2">Export</span><button aria-label="Close" class="ib"><svg aria-hidden="true" class="i" viewbox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"></path></svg></button></div>
<div class="fld"><span class="fl">Period</span><button class="inp" style="min-height:48px;justify-content:space-between"><span class="b">Tax year 2026/27</span><svg aria-hidden="true" class="i s m3" viewbox="0 0 24 24"><path d="M6 9l6 6 6-6"></path></svg></button></div>
<span class="fl">Files</span>
<div class="grp">
<div class="set"><span class="sel on" style="border-radius:6px"><svg aria-hidden="true" class="i" style="width:14px;height:14px;stroke-width:3" viewbox="0 0 24 24"><path d="M5 12l5 5L20 7"></path></svg></span><span class="grow b">CSV – all entries</span></div>
<div class="set"><span class="sel on" style="border-radius:6px"><svg aria-hidden="true" class="i" style="width:14px;height:14px;stroke-width:3" viewbox="0 0 24 24"><path d="M5 12l5 5L20 7"></path></svg></span><span class="grow b">CSV – totals by category</span></div>
<div class="set"><span class="sel" style="border-radius:6px"></span><span class="grow">CSV – mileage log</span></div>
<div class="set"><span class="sel on" style="border-radius:6px"><svg aria-hidden="true" class="i" style="width:14px;height:14px;stroke-width:3" viewbox="0 0 24 24"><path d="M5 12l5 5L20 7"></path></svg></span><span class="grow b">PDF report</span></div>
<div class="set"><span class="sel" style="border-radius:6px"></span><span class="grow">Receipt photos (ZIP)</span></div>
</div>
<div class="flex sb" style="min-height:48px"><span class="t">Include personal entries</span><button aria-label="Include personal entries, off" class="tg"></button></div>
<div class="card" style="background:var(--sf2);box-shadow:none;padding:12px;display:flex;gap:10px"><svg aria-hidden="true" class="i s m2" viewbox="0 0 24 24"><path d="M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18zM12 16v-4M12 8h.01"></path></svg><span class="tx m2" style="font-weight:500">Making Tax Digital: Sunday Sort isn't MTD software. Use these CSVs with bridging software or send them to your accountant.</span></div>
<button class="btn w"><svg aria-hidden="true" class="i" viewbox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"></path></svg>Export</button>
</div>
</div>
</div></div>
</body>
</html>
