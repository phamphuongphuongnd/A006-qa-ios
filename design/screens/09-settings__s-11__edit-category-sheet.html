<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>S-11 Edit category sheet — Sunday Sort</title>
<link rel="stylesheet" href="../fonts/inter.css">
<link rel="stylesheet" href="../sunday.css">
<style>body{margin:0;background:#ECE8E0;}</style>
</head>
<body>
<div class="board" style="display:inline-flex;padding:40px;background:#ECE8E0;width:auto;height:auto"><div class="cell"><div class="cap"><span class="id">S-11</span>Edit category sheet</div>
<div class="ph">
<div class="top"><span></span><span class="h3">Categories</span><span></span></div>
<div class="scrim"></div>
<div class="sheet" style="top:84px;gap:14px">
<div class="grab"></div>
<div class="flex sb"><span class="h2">Edit category</span><button aria-label="Close" class="ib"><svg aria-hidden="true" class="i" viewbox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"></path></svg></button></div>
<div class="fld"><span class="fl">Name</span><div class="inp focus">Fuel</div></div>
<div class="fld"><span class="fl">Icon &amp; colour</span>
<div style="display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:8px">
<button aria-label="Fuel icon" class="ib" style="width:100%;border-radius:12px;background:var(--expsoft);color:var(--expink);box-shadow:inset 0 0 0 2px var(--expink)"><svg aria-hidden="true" class="i" viewbox="0 0 24 24"><path d="M4 21V5a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v16M3 21h12M4 10h10M14 8h2a2 2 0 0 1 2 2v6a1.5 1.5 0 0 0 3 0V8l-3-3"></path></svg></button>
<button aria-label="Wrench icon" class="ib" style="width:100%;border-radius:12px;background:var(--sf2)"><svg aria-hidden="true" class="i" viewbox="0 0 24 24"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.8-3.8a6 6 0 0 1-7.9 7.9l-6.9 6.9a2.1 2.1 0 0 1-3-3l6.9-6.9a6 6 0 0 1 7.9-7.9z"></path></svg></button>
<button aria-label="Shield icon" class="ib" style="width:100%;border-radius:12px;background:var(--sf2)"><svg aria-hidden="true" class="i" viewbox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg></button>
<button aria-label="Parking icon" class="ib" style="width:100%;border-radius:12px;background:var(--sf2)"><svg aria-hidden="true" class="i" viewbox="0 0 24 24"><path d="M4 4h16v16H4zM9 17V7h4a3 3 0 0 1 0 6H9"></path></svg></button>
<button aria-label="Phone icon" class="ib" style="width:100%;border-radius:12px;background:var(--sf2)"><svg aria-hidden="true" class="i" viewbox="0 0 24 24"><path d="M7 2h10a1 1 0 0 1 1 1v18a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V3a1 1 0 0 1 1-1zM11 18h2"></path></svg></button>
<button aria-label="Shirt icon" class="ib" style="width:100%;border-radius:12px;background:var(--sf2)"><svg aria-hidden="true" class="i" viewbox="0 0 24 24"><path d="M20.4 6.6 16 3a4 4 0 0 1-8 0L3.6 6.6l2 4.4L7 10v11h10V10l1.4 1z"></path></svg></button>
<button aria-label="Package icon" class="ib" style="width:100%;border-radius:12px;background:var(--sf2)"><svg aria-hidden="true" class="i" viewbox="0 0 24 24"><path d="M21 8 12 3 3 8v8l9 5 9-5zM3 8l9 5 9-5M12 13v8"></path></svg></button>
<button aria-label="Star icon" class="ib" style="width:100%;border-radius:12px;background:var(--sf2)"><svg aria-hidden="true" class="i" viewbox="0 0 24 24"><path d="M12 2l3 6.5 7 .9-5 4.8 1.3 7-6.3-3.5L5.7 21 7 14.2 2 9.4l7-.9z"></path></svg></button>
<button aria-label="Receipt icon" class="ib" style="width:100%;border-radius:12px;background:var(--sf2)"><svg aria-hidden="true" class="i" viewbox="0 0 24 24"><path d="M5 3h14v18l-3-2-2 2-2-2-2 2-2-2-3 2zM9 8h6M9 12h6M9 16h4"></path></svg></button>
<button aria-label="Key icon" class="ib" style="width:100%;border-radius:12px;background:var(--sf2)"><svg aria-hidden="true" class="i" viewbox="0 0 24 24"><path d="M21 2l-9.6 9.6M15.5 7.5l3 3L22 7l-3-3M7.5 22a5.5 5.5 0 1 0 0-11 5.5 5.5 0 0 0 0 11z"></path></svg></button>
<button aria-label="Calculator icon" class="ib" style="width:100%;border-radius:12px;background:var(--sf2)"><svg aria-hidden="true" class="i" viewbox="0 0 24 24"><path d="M5 2h14v20H5zM8 6h8M8 11h.01M12 11h.01M16 11h.01M8 15h.01M12 15h.01M16 15h.01M8 19h8"></path></svg></button>
<button aria-label="More icons" class="ib" style="width:100%;border-radius:12px;background:var(--sf2)"><svg aria-hidden="true" class="i" style="stroke-width:3" viewbox="0 0 24 24"><path d="M5 12h.01M12 12h.01M19 12h.01"></path></svg></button>
</div>
<div class="flex" style="gap:8px;margin-top:6px;justify-content:space-between">
<span style="width:28px;height:28px;border-radius:14px;background:#C8553D;box-shadow:0 0 0 2px var(--sf),0 0 0 4px #C8553D"></span><span style="width:28px;height:28px;border-radius:14px;background:#E08A2E"></span><span style="width:28px;height:28px;border-radius:14px;background:#C9A227"></span><span style="width:28px;height:28px;border-radius:14px;background:#1E8E5A"></span><span style="width:28px;height:28px;border-radius:14px;background:#178A8A"></span><span style="width:28px;height:28px;border-radius:14px;background:#2E6FD8"></span><span style="width:28px;height:28px;border-radius:14px;background:#4E4BB8"></span><span style="width:28px;height:28px;border-radius:14px;background:#7A6F9B"></span><span style="width:28px;height:28px;border-radius:14px;background:#B5487A"></span><span style="width:28px;height:28px;border-radius:14px;background:#5F6877"></span>
</div>
</div>
<div class="fld"><span class="fl">Tax form line</span><button class="inp" style="justify-content:space-between;min-height:52px"><span class="ts b">Car, van and travel expenses</span><svg aria-hidden="true" class="i s m3" viewbox="0 0 24 24"><path d="M6 9l6 6 6-6"></path></svg></button></div>
<div class="flex sb" style="min-height:48px"><div class="col"><span>Hide category</span><span class="tx m3" style="font-weight:500">Hidden categories keep their past entries.</span></div><button aria-label="Hide category, off" class="tg"></button></div>
<button class="btn w">Save</button>
</div>
</div>
</div></div>
</body>
</html>
