<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>S-03 Typed + photo + note — Sunday Sort</title>
<link rel="stylesheet" href="../fonts/inter.css">
<link rel="stylesheet" href="../sunday.css">
<style>body{margin:0;background:#ECE8E0;}</style>
</head>
<body>
<div class="board" style="display:inline-flex;padding:40px;background:#ECE8E0;width:auto;height:auto"><div class="cell"><div class="cap"><span class="id">S-03</span>Typed + photo + note</div>
<div class="ph" style="background:var(--sf)">
<div class="top" style="padding-top:54px"><button aria-label="Close" class="ib"><svg aria-hidden="true" class="i" viewbox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"></path></svg></button><div class="seg" style="width:204px"><button class="oe">Expense</button><button>Income</button></div><button class="chip s">Now</button></div>
<div class="col ctr" style="flex:1;gap:4px;padding:0 20px">
<div class="flex" style="gap:2px;align-items:center"><span class="amt exp" style="font-size:64px;line-height:72px">£72.40</span><span style="width:3px;height:56px;background:var(--expbtn);border-radius:2px"></span></div>
<div class="flex ts m2" style="gap:6px"><svg aria-hidden="true" class="i s" viewbox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16zM14 6l4 4"></path></svg>Shell M62</div>
</div>
<div class="col" style="gap:14px;padding:0 20px 12px">
<div class="flex" style="justify-content:space-around;align-items:flex-start">
<div class="rbl"><span style="position:relative;display:block"><span class="rc"></span><button aria-label="Remove photo" class="ib" style="position:absolute;top:-14px;right:-14px;width:28px;height:28px;background:var(--br);color:var(--onbr);box-shadow:0 0 0 2px var(--sf)"><svg aria-hidden="true" class="i" style="width:14px;height:14px;stroke-width:3" viewbox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"></path></svg></button></span>Receipt</div>
<div class="rbl"><button class="chip" style="height:56px;border-radius:28px;padding:0 20px;background:var(--worksoft);color:var(--work);box-shadow:none;font-weight:700"><svg aria-hidden="true" class="i" viewbox="0 0 24 24"><path d="M3 8h18v12H3zM8 8V5a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v3M3 13h18"></path></svg>Work</button>Tap for Personal</div>
<div class="rbl"><button aria-label="Edit note" class="rb" style="box-shadow:inset 0 0 0 2px var(--br)"><svg aria-hidden="true" class="i" viewbox="0 0 24 24"><path d="M4 20h4L19 9l-4-4L4 16zM14 6l4 4"></path></svg></button>Note</div>
</div>
<div class="chips x"><button class="chip s on">Shell</button><button class="chip s">Parking</button><button class="chip s">Greggs</button><button class="chip s">Amazon Flex payout</button></div>
<button class="btn w exp">Save</button>
<div class="tx m3" style="text-align:center;margin-top:-4px">No category needed — you'll sort it on Sunday.</div>
</div>
<div class="kb"><span>1</span><span>2</span><span>3</span><span>4</span><span>5</span><span>6</span><span>7</span><span>8</span><span>9</span><span class="k2"></span><span>0</span><span class="k2"><svg aria-hidden="true" class="i" viewbox="0 0 24 24"><path d="M21 5H9l-6 7 6 7h12zM17 9l-6 6M11 9l6 6"></path></svg></span></div>
</div>
</div></div>
