<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dialog — Sunday Sort v2</title>
<link rel="stylesheet" href="../fonts/inter.css">
<link rel="stylesheet" href="../sunday.css">
<style>body{margin:0;background:var(--bg)}</style>
</head>
<body>

<div class="ss" style="padding:24px;display:flex;flex-wrap:wrap;gap:24px;align-items:flex-start">
<div style="position:relative;width:360px;height:280px;border-radius:24px;overflow:hidden;background:var(--bg)"><div class="scrim"></div><div class="dialog"><div class="headline">Delete this entry?</div><p class="muted" style="margin:8px 0 0">This also deletes its receipt photos.</p><div class="col" style="gap:8px;margin-top:20px"><span class="btn block" style="background:var(--error);color:var(--on-primary)">Delete</span><span class="btn btn-sec block">Cancel</span></div></div></div><div style="position:relative;width:360px;height:280px;border-radius:24px;overflow:hidden;background:var(--bg)"><div class="scrim"></div><div class="dialog"><div class="headline">Change how you claim vehicle costs?</div><p class="muted" style="margin:8px 0 0">HMRC expects you to keep the same method for the same vehicle. Check with your accountant.</p><div class="col" style="gap:8px;margin-top:20px"><span class="btn block">Change</span><span class="btn btn-sec block">Cancel</span></div></div></div>
</div>

</body>
</html>
