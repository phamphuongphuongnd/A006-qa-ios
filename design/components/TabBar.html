<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TabBar — Sunday Sort v2</title>
<link rel="stylesheet" href="../fonts/inter.css">
<link rel="stylesheet" href="../sunday.css">
<style>body{margin:0;background:var(--bg)}</style>
</head>
<body>

<div class="ss" style="padding:24px;display:flex;flex-wrap:wrap;gap:24px;align-items:flex-start">
<div style="width:390px;border-radius:16px;overflow:hidden"><div class="tabwrap"><div class="tabbar"><div class="tab"><span class="pill"><i class="ic ic-home " aria-hidden="true"></i></span>Home</div><div class="tab"><span class="pill"><i class="ic ic-list " aria-hidden="true"></i></span>Entries</div><div class="tab on"><span class="pill"><i class="ic ic-tray " aria-hidden="true"></i></span>Sort<span class="count num">14</span></div><div class="tab"><span class="pill"><i class="ic ic-route " aria-hidden="true"></i></span>Miles</div><div class="tab"><span class="pill"><i class="ic ic-chart " aria-hidden="true"></i></span>Reports</div></div></div></div>
</div>

</body>
</html>
