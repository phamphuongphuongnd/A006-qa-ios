<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cover — Sunday Sort v2</title>
<link rel="stylesheet" href="../fonts/inter.css">
<link rel="stylesheet" href="../sunday.css">
<style>body{margin:0;background:var(--bg)}
  html, body { margin:0; height:100%; }
  body { background:var(--bg); color:var(--ink); font-family:var(--font-sans); overflow:hidden; }
  .cover { position:relative; height:300px; overflow:hidden; }
  .art { position:absolute; top:0; left:480px; width:480px; height:300px; overflow:hidden; }
  .art svg { display:block; width:480px; height:300px; }
  .slab { fill:var(--primary); }
  .tint { fill:var(--sunday-soft); }
  .sun { fill:var(--sunday); }
  .work { fill:var(--work); }
  .exp { fill:var(--expense); }
  .ray { stroke:var(--sunday); stroke-width:8px; stroke-linecap:round; }
  .words { position:absolute; left:var(--space-6); bottom:var(--space-6); max-width:440px; }
  .name { margin:0; font-size:100px; line-height:.95; font-weight:800; letter-spacing:-.03em; color:var(--ink); }
  .tag { margin:var(--space-3) 0 0 4px; font-size:14px; line-height:20px; color:var(--ink-muted); }
</style>
</head>
<body>

<div class="cover">
<div class="art" aria-hidden="true">
<svg viewBox="0 0 480 300" width="480" height="300">
<!--
  blocks      primary slab 176x236 bled off the top (the brand navy) · sunday-soft 288x176 bleeding right (the Sunday tint) · sunday half-disc r112 (the sun) · work pill 96x48 and expense pill 64x48 (scope and money, small) — about 40% of 960x300
  arrangement one tall slab with satellites: the sun rises over the tint block, two small pills sit under the slab on its baseline
  pattern     literal motif, the Sunday sun: 7 rays as space-2-thick round pills from radius-full, on the tint and ground
  scales      gutters space-4 (16); corners radius-card (16) on blocks; pills rx = half of tap-min (24); ray stroke space-2 (8)
-->
<rect class="slab" x="0" y="-16" width="176" height="236" rx="16"/>
<rect class="tint" x="192" y="60" width="304" height="176" rx="16"/>
<path class="sun" d="M224 236 A112 112 0 0 1 448 236 Z"/>
<line class="ray" x1="212.4" y1="202.9" x2="185.3" y2="195.6"/>
<line class="ray" x1="237.9" y1="153.7" x2="216.5" y2="135.7"/>
<line class="ray" x1="281.9" y1="120.0" x2="270.1" y2="94.6"/>
<line class="ray" x1="336.0" y1="108.0" x2="336.0" y2="80.0"/>
<line class="ray" x1="390.1" y1="120.0" x2="401.9" y2="94.6"/>
<line class="ray" x1="434.1" y1="153.7" x2="455.5" y2="135.7"/>
<line class="ray" x1="459.6" y1="202.9" x2="486.7" y2="195.6"/>
<rect class="work" x="0" y="236" width="96" height="48" rx="24"/>
<rect class="exp" x="112" y="236" width="64" height="48" rx="24"/>
</svg>
</div>
<div class="words">
<h1 class="name">Sunday<br>Sort</h1>
<p class="tag">Log it in 10 seconds. Sort it on Sunday.</p>
</div>
</div>

</body>
</html>
