# App still starts after everything above; last look at Home / Entries / Reports.
appId: com.phiotron.sundaysort
name: 99_final_state
---
- launchApp
- extendedWaitUntil:
    visible: "Settings|Get started"
    timeout: 30000
- takeScreenshot: ${PID}_99a_home
- runFlow:
    when:
      visible: "Settings"
    commands:
      - tapOn: "Entries.*"
      - waitForAnimationToEnd:
          timeout: 3000
      - takeScreenshot: ${PID}_99b_entries
      - tapOn: "Reports"
      - waitForAnimationToEnd:
          timeout: 3000
      - takeScreenshot: ${PID}_99c_reports
