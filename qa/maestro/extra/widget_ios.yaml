# Try to add the Sunday Sort widget to the simulator home screen (SpringBoard). Any miss → ⏭ in result.json.
appId: com.phiotron.sundaysort
name: widget_ios
---
- launchApp
- extendedWaitUntil:
    visible: "Settings"
    timeout: 60000
- pressKey: Home
- waitForAnimationToEnd:
    timeout: 3000
- longPressOn:
    point: "50%,45%"
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: ${PID}_W1_jiggle
- tapOn:
    text: "Edit"
    optional: true
- tapOn:
    text: "Add Widget"
    optional: true
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: ${PID}_W2_gallery
- tapOn: "Search Widgets"
- inputText: "Sunday"
- waitForAnimationToEnd:
    timeout: 3000
- tapOn: "Sunday Sort"
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: ${PID}_W3_widget_sizes
- tapOn: "Add Widget"
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    text: "Done"
    optional: true
- pressKey: Home
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: ${PID}_W4_widget_on_home
