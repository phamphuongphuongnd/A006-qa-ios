# B-147 (QI-8): on the Sort card at big text the category chips must be reachable, and Edit / Split must keep the
# field being typed and the "Done" / "Split & sort" button reachable with the number pad up. Run on iPhone SE XXXL
# (scrolling layout on iOS), SE XXL / Pro Max XXXL (normal layout), SE AX-L (scrolling) and iPad.
# The top card may be a fixture entry, not ours → no amounts are typed that must add up: the field is focused (number
# pad up) and the button is tapped. Maestro counts an element under the keyboard as visible, so a covered button makes
# the tap land on a key → the panel stays open → the step fails (B-151 evidence, run 44672153434).
appId: com.phiotron.sundaysort
name: 23_sort_edit_split
---
# A fresh unsorted entry (06/07 already sorted and split the first one).
- runFlow:
    file: common/capture.yaml
    env:
      NOTE: "QA-${PID} B147"
- tapOn: "Save"
- extendedWaitUntil:
    visible: "Saved · .*"
    timeout: 10000
- runFlow: common/home.yaml
- tapOn:
    point: "50%,${SORT_TAB_Y}"
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: ${PID}_23a_sort
- assertNotVisible: "Nothing to sort"
- scrollUntilVisible:
    element:
      text: "More…"
    timeout: 15000
- takeScreenshot: ${PID}_23b_chips
- assertVisible: "More…"
# Edit on the card: amount field focused, number pad up, then "Done" must take the tap.
- scrollUntilVisible:
    element:
      text: "Edit"
    timeout: 6000
    optional: true
- runFlow:
    when:
      notVisible: "Edit"
    commands:
      - scrollUntilVisible:
          element:
            text: "Edit"
          direction: UP
          timeout: 8000
- tapOn: "Edit"
- extendedWaitUntil:
    visible: "Done"
    timeout: 5000
- tapOn:
    text: "Amount"
    index: 1
- inputText: "1"
- eraseText: 1
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: ${PID}_23c_edit_typing
- tapOn: "Done"
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: ${PID}_23d_after_done
- assertNotVisible: "Done"
# Split on the card: default two equal parts (valid). Focus Part 2 (number pad up), then "Split & sort" must take the tap.
# SE XXL: the actions row can be above the chips → look both ways.
- scrollUntilVisible:
    element:
      text: "Split"
    timeout: 6000
    optional: true
- runFlow:
    when:
      notVisible: "Split"
    commands:
      - scrollUntilVisible:
          element:
            text: "Split"
          direction: UP
          timeout: 8000
- tapOn: "Split"
- extendedWaitUntil:
    visible: "Split into parts"
    timeout: 5000
- takeScreenshot: ${PID}_23f_split_open
- scrollUntilVisible:
    element:
      text: "Part 2 Amount"
    timeout: 8000
- tapOn: "Part 2 Amount"
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: ${PID}_23g_split_keyboard_up
- tapOn: "Split & sort"
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: ${PID}_23h_after_split_tap
# Parts without a category go back to the queue as two unsorted entries: the split panel closes.
- extendedWaitUntil:
    notVisible: "Split & sort"
    timeout: 8000
- takeScreenshot: ${PID}_23i_after_split
