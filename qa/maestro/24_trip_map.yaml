# Short GPS trip (~0.8 km) → Miles → trip detail: the map (MapLibre / OpenFreeMap) and the page sheet sit in the
# centre column on iPad (B-146). On iPhone it only adds a map screenshot.
appId: com.phiotron.sundaysort
name: 24_trip_map
---
- runFlow: common/home.yaml
- setLocation:
    latitude: 51.5007
    longitude: -0.1246
- scrollUntilVisible:
    element:
      text: "Start trip"
    timeout: 15000
- tapOn: "Start trip"
- tapOn:
    text: "Continue|Allow.*location.*"
    optional: true
- tapOn:
    text: "Allow While Using App|Allow Once"
    optional: true
- tapOn:
    text: "Allow precise location"
    optional: true
- tapOn:
    text: "Allow While Using App|Allow Once"
    optional: true
- tapOn:
    text: "Not now"
    optional: true
- extendedWaitUntil:
    visible: "End trip"
    timeout: 30000
- travel:
    points:
      - 51.5007,-0.1246
      - 51.5045,-0.1236
      - 51.5079,-0.1224
    speed: 5
- takeScreenshot: ${PID}_24a_trip_running
- tapOn: "End trip"
- extendedWaitUntil:
    visible: "Trip saved.*|Save"
    timeout: 15000
- takeScreenshot: ${PID}_24b_end_sheet
- scrollUntilVisible:
    element:
      text: "Save"
    timeout: 15000
    optional: true
- tapOn:
    text: "Save"
    index: 0
- waitForAnimationToEnd:
    timeout: 4000
- runFlow: common/home.yaml
- tapOn: "Miles"
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: ${PID}_24c_miles
# Newest trip first. Not '.*GPS.*': the source tag on a hand-started GPS trip was never checked on iOS.
- scrollUntilVisible:
    element:
      text: '.*Swipe right for work.*'
    timeout: 15000
- tapOn:
    text: '.*Swipe right for work.*'
    index: 0
- extendedWaitUntil:
    visible: "qa-never-shown-map-load"
    timeout: 25000
    optional: true
- takeScreenshot: ${PID}_24d_trip_detail_map
- scroll
- takeScreenshot: ${PID}_24e_trip_detail_lower
