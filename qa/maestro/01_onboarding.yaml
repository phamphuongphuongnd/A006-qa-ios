appId: com.phiotron.sundaysort
name: 01_onboarding
---
- launchApp:
    clearState: true
# `-land` personas (B-155): the whole run in landscape. Portrait personas never call setOrientation; the landscape
# persona runs last on the iPad lane.
- runFlow:
    when:
      true: ${ORIENT == 'LANDSCAPE_LEFT'}
    commands:
      - setOrientation: LANDSCAPE_LEFT
      - waitForAnimationToEnd:
          timeout: 2000
# A late iOS "Open in “Sunday Sort”?" alert from the previous persona's deep link can still be on screen (run 44258898134).
- tapOn:
    text: "Cancel"
    optional: true
- extendedWaitUntil:
    visible: "Get started"
    timeout: 90000
- takeScreenshot: ${PID}_01a_welcome
- tapOn: "Get started"
- extendedWaitUntil:
    visible: 'Where do you file your taxes\?'
    timeout: 15000
# Big Dynamic Type on a small iPhone pushes the second card below the fold.
- scrollUntilVisible:
    element:
      text: "${REGION_LABEL}.*"
    timeout: 15000
- tapOn: "${REGION_LABEL}.*"
- takeScreenshot: ${PID}_01b_region
- scrollUntilVisible:
    element:
      text: "Continue"
    timeout: 10000
- tapOn: "Continue"
- extendedWaitUntil:
    visible: 'How do you claim your vehicle\?'
    timeout: 15000
- takeScreenshot: ${PID}_01c_vehicle
# iPad lane (B-146): the "What's the difference?" Sheet must sit centred, at most 640 pt wide.
- runFlow:
    when:
      true: ${LANE == 'ipad'}
    commands:
      - tapOn:
          text: 'What.s the difference\?'
          optional: true
      - waitForAnimationToEnd:
          timeout: 3000
      - takeScreenshot: ${PID}_01c2_difference_sheet
      - tapOn:
          text: "Close|Got it|Done|OK"
          optional: true
      - runFlow:
          when:
            notVisible: 'How do you claim your vehicle\?'
          commands:
            - swipe:
                direction: DOWN
      - waitForAnimationToEnd:
          timeout: 2000
- scrollUntilVisible:
    element:
      text: "Continue"
    timeout: 10000
- tapOn: "Continue"
- extendedWaitUntil:
    visible: "Your categories are ready"
    timeout: 15000
- takeScreenshot: ${PID}_01d_categories
- scrollUntilVisible:
    element:
      text: "Looks good"
    timeout: 10000
- tapOn: "Looks good"
# Free launch (PRO_PAUSED, dev 08b3930): "Looks good" goes straight to the reminder page; the Free / Pro page only
# exists while Pro is on. Never See Pro / trial / Subscribe.
- extendedWaitUntil:
    visible: 'Continue free|When do you want to sort your week\?'
    timeout: 15000
- runFlow:
    when:
      visible: "Continue free"
    commands:
      - takeScreenshot: ${PID}_01e_free_pro
      - tapOn: "Continue free"
- extendedWaitUntil:
    visible: 'When do you want to sort your week\?'
    timeout: 15000
- takeScreenshot: ${PID}_01f_reminder
- scrollUntilVisible:
    element:
      text: "Not now"
    timeout: 10000
- tapOn: "Not now"
- extendedWaitUntil:
    visible: "Settings"
    timeout: 20000
- takeScreenshot: ${PID}_01g_home_first
