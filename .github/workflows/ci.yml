name: CI

# Studio rule (WORKFLOW §7): no CI on dev; main runs lint + typecheck + tests only.
on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'design/**'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx expo lint
      - run: npx tsc --noEmit
      - run: npx jest --ci
