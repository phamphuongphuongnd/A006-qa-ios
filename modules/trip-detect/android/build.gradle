plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'com.phiotron.sundaysort'
version = '0.1.0'

android {
  namespace "com.phiotron.sundaysort.tripdetect"
  defaultConfig {
    versionCode 1
    versionName '0.1.0'
  }
}

dependencies {
  implementation 'androidx.core:core:1.17.0'
  implementation 'com.facebook.react:react-android'
  // Same artifact expo-location already ships (ActivityRecognitionClient).
  implementation 'com.google.android.gms:play-services-location:21.0.1'
  // A13-13: lift expo-location's "app must be on screen" guard for a background trip start (see TripDetectModule).
  // The app ships expo-location itself; SDK 58 links it precompiled (local Maven repo), from source as a project.
  if (findProject(':expo-location') != null) {
    compileOnly project(':expo-location')
  } else {
    def expoLocation = new groovy.json.JsonSlurper().parse(new File(rootDir, '../node_modules/expo-location/package.json')).version
    compileOnly "host.exp.exponent:expo.modules.location:${expoLocation}"
  }
}
